<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" role="img" aria-label="I'm a software engineer in Hyderabad. I like building the whole thing, from the database to the button, and lately that includes the layer where a language model makes a guess and the rest of the system decides whether to trust it."><defs><pattern id="gm" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#ffffff" stroke-opacity=".05"/></pattern><pattern id="g" width="100" height="100" patternUnits="userSpaceOnUse"><rect width="100" height="100" fill="url(#gm)"/><path d="M100 0H0V100" fill="none" stroke="#ffffff" stroke-opacity=".11"/></pattern></defs><style>text{font-family:'JetBrains Mono','SF Mono',Consolas,'DejaVu Sans Mono',monospace}</style><rect width="1000" height="150" fill="#0e3a6b"/><rect width="1000" height="150" fill="url(#g)"/><path d="M8,18 V8 H18" fill="none" stroke="#8fd3ff" stroke-width="1.2"/><path d="M992,18 V8 H982" fill="none" stroke="#8fd3ff" stroke-width="1.2"/><path d="M8,132 V142 H18" fill="none" stroke="#8fd3ff" stroke-width="1.2"/><path d="M992,132 V142 H982" fill="none" stroke="#8fd3ff" stroke-width="1.2"/><text x="30" y="34" font-size="10" fill="#9fbde0" font-weight="700" text-anchor="start" letter-spacing="2.5">SPECIFICATION</text><line x1="30" y1="42" x2="150" y2="42" stroke="#9fbde0" stroke-width=".6"/><text x="30" y="72" font-size="16" fill="#e6f0ff" font-weight="400" text-anchor="start" >I'm a software engineer in Hyderabad. I like building the whole thing, from the database</text><text x="30" y="97" font-size="16" fill="#e6f0ff" font-weight="400" text-anchor="start" >to the button, and lately that includes the layer where a language model makes a guess</text><text x="30" y="122" font-size="16" fill="#e6f0ff" font-weight="400" text-anchor="start" >and the rest of the system decides whether to trust it.</text><text x="970" y="34" font-size="10" fill="#9fbde0" font-weight="400" text-anchor="end" letter-spacing="1.5">REF. SHEET 1</text></svg>
